<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{title}}</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="logo">REI Co-op | Uncommon Path</div>
  <nav class="main-nav">
    <a href="/">Home</a>
    <a href="/tag/climate-change">Climate Change</a>
    <a href="/tag/news">News</a>
  </nav>
</header>
<main>
  <article class="post-detail">
    <img src="{{hero}}" alt="{{title}}" class="hero-img">
    <h1>{{title}}</h1>
    <p class="meta">{{author}} | {{date}}</p>
    <div class="content">{{content}}</div>
  </article>
</main>
<footer class="site-footer">
  <p>© 2026 REI Co-op</p>
</footer>
</body>
</html>
